name: "Build and Test - Linux"

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      ubuntu-version:
        description: 'Ubuntu version'
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
        default: ubuntu-22.04
      bundle-type:
        description: 'Bundle type'
        required: true
        type: choice
        options:
          - deb
          - appimage
          - rpm
          - all
        default: all
      backends:
        description: 'Acceleration backend(s) to build'
        required: true
        type: choice
        options:
          - cpu
          - cuda
          - vulkan
          - all
        default: all
      sign-build:
        description: 'Sign the build'
        required: true
        type: boolean
        default: true
      upload-artifacts:
        description: 'Upload build artifacts'
        required: true
        type: boolean
        default: true

# Cancel duplicate workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  WHISPER_NO_AVX: ON
  WHISPER_NO_AVX2: ON

jobs:
  # Turns the single `backends` choice input into a JSON matrix so the build
  # job below can fan out into parallel cpu/cuda/vulkan legs. Each leg produces
  # its own artifact set (compile-time Cargo features, not a runtime switch, so
  # one binary cannot support multiple backends at once).
  plan-matrix:
    name: Plan backend matrix
    runs-on: ubuntu-22.04
    outputs:
      backends: ${{ steps.plan.outputs.backends }}
    steps:
      - name: Determine backend matrix
        id: plan
        shell: bash
        run: |
          case "${{ github.event.inputs.backends || 'all' }}" in
            all)
              echo 'backends=["cpu","cuda","vulkan"]' >> "$GITHUB_OUTPUT"
              ;;
            cpu)
              echo 'backends=["cpu"]' >> "$GITHUB_OUTPUT"
              ;;
            cuda)
              echo 'backends=["cuda"]' >> "$GITHUB_OUTPUT"
              ;;
            vulkan)
              echo 'backends=["vulkan"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-linux:
    name: Build Linux (x64, ${{ matrix.backend }})
    needs: plan-matrix
    runs-on: ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.plan-matrix.outputs.backends) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile and bundle args
        id: build-profile
        shell: bash
        run: |
          # Determine build profile
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

          # Determine bundle arguments
          BUNDLE_TYPE="${{ github.event.inputs.bundle-type }}"
          if [[ "$BUNDLE_TYPE" == "all" ]] || [[ -z "$BUNDLE_TYPE" ]]; then
            # "all" builds every Linux package format Tauri v2 supports on
            # this runner (deb, rpm, and appimage all work on both 22.04 and
            # 24.04; FUSE for AppImage is installed unconditionally below and
            # rpm bundling is native to tauri-bundler, no rpmbuild required).
            BUNDLES="deb,appimage,rpm"
          else
            BUNDLES="$BUNDLE_TYPE"
          fi

          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "args=--debug --bundles $BUNDLES" >> "$GITHUB_OUTPUT"
          else
            echo "args=--bundles $BUNDLES" >> "$GITHUB_OUTPUT"
          fi
          echo "Bundle types: $BUNDLES"

      # Maps the matrix backend to the Cargo feature flags for the main app
      # (frontend/src-tauri, see its `cuda`/`vulkan`/`openblas` features in
      # Cargo.toml) and for the llama-helper sidecar (its own `cuda`/`vulkan`
      # features), which build separately.
      - name: Determine backend feature flags
        id: backend-features
        shell: bash
        run: |
          case "${{ matrix.backend }}" in
            cpu)
              echo "app_features=openblas" >> "$GITHUB_OUTPUT"
              echo "llama_features=" >> "$GITHUB_OUTPUT"
              echo "artifact_suffix=cpu" >> "$GITHUB_OUTPUT"
              ;;
            cuda)
              echo "app_features=cuda" >> "$GITHUB_OUTPUT"
              echo "llama_features=--features cuda" >> "$GITHUB_OUTPUT"
              echo "artifact_suffix=cuda" >> "$GITHUB_OUTPUT"
              ;;
            vulkan)
              echo "app_features=vulkan" >> "$GITHUB_OUTPUT"
              echo "llama_features=--features vulkan" >> "$GITHUB_OUTPUT"
              echo "artifact_suffix=vulkan" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}-x86_64-unknown-linux-gnu-${{ matrix.backend }}

      - name: Install dependencies (Ubuntu 24.04)
        if: github.event.inputs.ubuntu-version == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Install dependencies (Ubuntu 22.04)
        if: github.event.inputs.ubuntu-version == 'ubuntu-22.04' || github.event.inputs.ubuntu-version == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev

      # whisper-rs-sys 0.15's build.rs hard-panics with
      # "BLAS_INCLUDE_DIRS environment variable must be set when using OpenBLAS"
      # whenever the openblas feature is on: it never probes pkg-config, it just
      # forwards this variable to CMake. The cpu leg builds the app with
      # --features openblas, so without this the Tauri build fails. libopenblas-dev
      # puts cblas.h in the multiarch include dir on jammy/noble, but resolve it
      # dynamically so a layout change doesn't silently reintroduce the panic.
      - name: Resolve OpenBLAS include dir
        shell: bash
        run: |
          for dir in /usr/include/x86_64-linux-gnu /usr/include/openblas /usr/include; do
            if [[ -f "$dir/cblas.h" ]]; then
              echo "Found cblas.h in $dir"
              echo "BLAS_INCLUDE_DIRS=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::cblas.h not found; is libopenblas-dev installed?"
          exit 1

      # Cache apt packages to speed up installation of system dependencies
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ hashFiles('**/apt-packages.txt') }}-${{ github.event.inputs.ubuntu-version }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Prepare Vulkan SDK (Ubuntu 24.04)
        if: github.event.inputs.ubuntu-version == 'ubuntu-24.04'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cache Vulkan SDK
        if: matrix.backend == 'vulkan' && (github.event.inputs.ubuntu-version == 'ubuntu-24.04')
        uses: actions/cache@v4
        with:
          path: /usr/lib/x86_64-vulkan
          key: vulkan-sdk-1.3.290-noble-${{ hashFiles('.github/workflows/build-linux.yml') }}
          restore-keys: |
            vulkan-sdk-1.3.290-noble-

      - name: Prepare Vulkan SDK (Ubuntu 22.04)
        if: github.event.inputs.ubuntu-version == 'ubuntu-22.04' || github.event.inputs.ubuntu-version == ''
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cache Vulkan SDK (Ubuntu 22.04)
        if: matrix.backend == 'vulkan' && (github.event.inputs.ubuntu-version == 'ubuntu-22.04' || github.event.inputs.ubuntu-version == '')
        uses: actions/cache@v4
        with:
          path: /usr/lib/x86_64-vulkan
          key: vulkan-sdk-1.3.290-jammy-${{ hashFiles('.github/workflows/build-linux.yml') }}
          restore-keys: |
            vulkan-sdk-1.3.290-jammy-

      # CUDA is only needed on the cuda leg. GitHub-hosted Linux runners have
      # no NVIDIA GPU, so this installs the toolkit (headers/nvcc/libs) to
      # compile against, but the resulting binary cannot be exercised on a
      # real GPU in CI. It runs correctly on an end user's NVIDIA machine.
      # Uses NVIDIA's official CUDA apt repo (12.x) rather than the outdated
      # `nvidia-cuda-toolkit` multiverse package (still on CUDA 11.5 as of
      # this writing), since ort/whisper-rs expect a modern CUDA toolchain.
      
      # Cache CUDA packages to speed up subsequent builds
      - name: Cache CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cuda-12.4
            /etc/apt/sources.list.d/cuda*
          key: cuda-toolkit-12.4-ubuntu-${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}
          restore-keys: |
            cuda-toolkit-12.4-ubuntu-
      
      - name: Install CUDA Toolkit (cuda backend only)
        if: matrix.backend == 'cuda'
        shell: bash
        run: |
          UBUNTU_CODENAME=$(. /etc/os-release && echo "${VERSION_ID//./}")
          # Check if CUDA is already installed from cache
          if [[ ! -d /usr/local/cuda-12.4 ]]; then
            echo "Installing CUDA Toolkit..."
            wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_CODENAME}/x86_64/cuda-keyring_1.1-1_all.deb
            sudo dpkg -i cuda-keyring_1.1-1_all.deb
            sudo apt-get update
            sudo apt-get install -y cuda-toolkit-12-4 libnccl2 libnccl-dev
            echo "/usr/local/cuda-12.4/bin" >> "$GITHUB_PATH"
          else
            echo "CUDA Toolkit found in cache"
          fi
          echo "CUDA_PATH=/usr/local/cuda-12.4" >> "$GITHUB_ENV"

      # `meetily` links against libcuda.so.1 (the real NVIDIA driver library,
      # loaded at runtime via the driver API) but GitHub's Linux runners have
      # no NVIDIA GPU and therefore no driver package, so libcuda.so.1 does
      # not exist anywhere on the system. That's fine for compiling and
      # linking (the linker only needs the SONAME), but linuxdeploy resolves
      # and bundles every ELF dependency by walking `ldd` at AppImage-build
      # time, and fails outright when a dependency can't be found:
      #   ERROR: Could not find dependency: libcuda.so.1
      # cuda-toolkit-12-4 does ship a link-time stub (a real libcuda.so with
      # the driver API symbols, just no device-side implementation) at
      # targets/x86_64-linux/lib/stubs/libcuda.so, meant for building against
      # without a physical GPU present. It just lacks the .1-versioned SONAME
      # symlink ldconfig would normally create from an actual driver install.
      # Registering that with the standard SONAME is the same workaround
      # NVIDIA's own install docs describe ("Add libcuda.so symbolic link, if
      # necessary") and what every CUDA-in-a-GPU-less-container guide does.
      - name: Symlink libcuda.so.1 stub for the AppImage bundler
        if: matrix.backend == 'cuda'
        run: |
          STUBS_DIR=/usr/local/cuda-12.4/targets/x86_64-linux/lib/stubs
          test -f "$STUBS_DIR/libcuda.so" || { echo "::error::libcuda.so stub not found under $STUBS_DIR"; exit 1; }
          sudo ln -sf libcuda.so "$STUBS_DIR/libcuda.so.1"
          echo "$STUBS_DIR" | sudo tee /etc/ld.so.conf.d/cuda-stubs.conf
          sudo ldconfig
          ldconfig -p | grep libcuda.so.1

      - name: Install FUSE for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build llama-helper sidecar
        run: |
          echo "Building llama-helper sidecar (backend: ${{ matrix.backend }})..."
          cargo build --release -p llama-helper ${{ steps.backend-features.outputs.llama_features }}

          # Copy binary to binaries directory
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

          echo "Copied llama-helper to frontend/src-tauri/binaries/"
          ls -la frontend/src-tauri/binaries/
      # cuda-toolkit-12-4 alone is several GB, on top of the Rust build
      # artifacts and node_modules already on disk. If the cuda leg runs the
      # runner low on space, linuxdeploy (which downloads its own tools and
      # writes an AppDir + squashfs image) can fail in ways that surface only
      # as the unhelpful generic "failed to run linuxdeploy" - this makes
      # that visible in the log before we get there.
      # Cache linuxdeploy and appimagetool to speed up AppImage creation
      - name: Cache linuxdeploy tools
        if: contains(steps.build-profile.outputs.args, 'appimage')
        uses: actions/cache@v4
        with:
          path: |
            ~/linuxdeploy
            ~/appimagetool
          key: appimage-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/build-linux.yml') }}
          restore-keys: |
            appimage-tools-${{ runner.os }}-

      - name: Report disk space before bundling
        run: df -h /

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO_STRIP=true: harmless no-op on the tauri-cli version pinned here
          # (2.11.x removed the strip step entirely - confirmed absent from
          # the compiled CLI binary's strings). Left set in case an older/
          # newer CLI reintroduces strip-related linuxdeploy failures
          # (tauri-apps/tauri#14796); see docs/building_in_linux.md.
          NO_STRIP: "true"
          # Tauri updater signing (ALWAYS enabled for .sig files)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # License validation RSA public key (embedded at build time)
          MEETILY_RSA_PUBLIC_KEY: ${{ secrets.MEETILY_RSA_PUBLIC_KEY }}
          # Supabase configuration (for online license verification)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          projectPath: frontend
          # -v matters here beyond normal log verbosity: tauri-bundler's
          # linuxdeploy invocation only captures/logs linuxdeploy's own
          # stdout/stderr when verbosity is above the default Error level
          # (see appimage/linuxdeploy.rs upstream); at the default level a
          # linuxdeploy failure surfaces only as the generic
          # "failed to run linuxdeploy" with no indication of the real cause.
          args: --target x86_64-unknown-linux-gnu --features ${{ steps.backend-features.outputs.app_features }} ${{ steps.build-profile.outputs.args }} -v

      - name: Verify build artifacts
        run: |
          echo "Build artifacts:"
          find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle -type f

      - name: Remove libwayland-client.so from AppImage
        if: contains(steps.build-profile.outputs.args, 'appimage')
        run: |
          # Find the AppImage file
          APPIMAGE_PATH=$(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/appimage -name "*.AppImage" | head -1)

          if [ -n "$APPIMAGE_PATH" ]; then
            echo "Processing AppImage: $APPIMAGE_PATH"

            # Make AppImage executable
            chmod +x "$APPIMAGE_PATH"

            # Extract AppImage
            cd "$(dirname "$APPIMAGE_PATH")"
            APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")

            # Extract using the AppImage itself
            "./$APPIMAGE_NAME" --appimage-extract

            # Remove libwayland-client.so files
            echo "Removing libwayland-client.so files..."
            find squashfs-root -name "libwayland-client.so*" -type f -delete

            # List what was removed for verification
            echo "Files remaining in lib directories:"
            find squashfs-root -name "lib*" -type d | head -5 | while read dir; do
              echo "Contents of $dir:"
              ls "$dir" | grep -E "(wayland|fuse)" || echo "  No wayland/fuse libraries found"
            done

            # Get appimagetool (use cached version if available)
            APPIMAGETOOL_PATH=~/appimagetool/appimagetool-x86_64.AppImage
            if [[ ! -f "$APPIMAGETOOL_PATH" ]]; then
              # Create cache directory and download
              mkdir -p ~/appimagetool
              wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O "$APPIMAGETOOL_PATH"
              chmod +x "$APPIMAGETOOL_PATH"
              echo "Downloaded appimagetool"
            else
              echo "Using cached appimagetool"
            fi

            # Repackage AppImage with no-appstream to avoid warnings
            ARCH=x86_64 "$APPIMAGETOOL_PATH" --no-appstream squashfs-root "$APPIMAGE_NAME"

            # Clean up extracted AppImage (keep appimagetool in cache)
            rm -rf squashfs-root

            echo "libwayland-client.so removed from AppImage successfully"
          else
            echo "No AppImage found to process"
          fi

      - name: Verify DEB package
        if: contains(steps.build-profile.outputs.args, 'deb')
        run: |
          DEB_PATH=$(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/deb -name "*.deb" | head -1)
          if [ -n "$DEB_PATH" ]; then
            echo "Verifying DEB package: $DEB_PATH"
            dpkg-deb --info "$DEB_PATH"
            dpkg-deb --contents "$DEB_PATH" | head -20
            echo "DEB package is valid"
          else
            echo "No DEB package found to verify"
          fi

      - name: Verify RPM package
        if: contains(steps.build-profile.outputs.args, 'rpm')
        run: |
          RPM_PATH=$(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/rpm -name "*.rpm" | head -1)
          if [ -n "$RPM_PATH" ]; then
            echo "Verifying RPM package: $RPM_PATH"
            sudo apt-get install -y rpm
            rpm -qip "$RPM_PATH"
            echo "RPM package is valid"
          else
            echo "No RPM package found to verify"
          fi

      - name: Verify AppImage
        if: contains(steps.build-profile.outputs.args, 'appimage')
        run: |
          APPIMAGE_PATH=$(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/appimage -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE_PATH" ]; then
            echo "Verifying AppImage: $APPIMAGE_PATH"
            chmod +x "$APPIMAGE_PATH"
            "$APPIMAGE_PATH" --appimage-help
            echo "AppImage is valid"
          else
            echo "No AppImage found to verify"
          fi

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload-artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: meetily-linux-${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}-x64-${{ steps.backend-features.outputs.artifact_suffix }}-${{ steps.build-profile.outputs.profile }}-${{ steps.get-version.outputs.version }}
          path: |
            target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/rpm/*.rpm
          retention-days: 30

      - name: Generate build summary
        run: |
          echo "## 🐧 Linux Build Summary (${{ matrix.backend }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.get-version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | ${{ matrix.backend }} (\`--features ${{ steps.backend-features.outputs.app_features }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Profile** | ${{ steps.build-profile.outputs.profile }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | x86_64-unknown-linux-gnu |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ubuntu Version** | ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle Types** | ${{ steps.build-profile.outputs.args }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signed** | ${{ github.event.inputs.sign-build == 'true' && '✅ Yes' || '❌ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| DEB Packages | $(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/deb -name "*.deb" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| AppImages | $(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/appimage -name "*.AppImage" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| RPM Packages | $(find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle/rpm -name "*.rpm" 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📋 File List</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find target/x86_64-unknown-linux-gnu/${{ steps.build-profile.outputs.profile }}/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null >> $GITHUB_STEP_SUMMARY
